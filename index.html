<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login siswa EduSky Learning">
    <title>Login - EduSky Learning</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/login.css?v=20260717">
    <link rel="stylesheet" href="assets/css/support-center.css?v=20260719-5">
</head>
<body>
    <main id="login-view">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-image">
                <img
                    src="https://placehold.co/400x400/38BDF8/FFFFFF?text=Ilustrasi+Siswa+AI"
                    alt="Ilustrasi siswa EduSky"
                    onerror="this.src='https://placehold.co/400x400/38BDF8/FFFFFF?text=Ilustrasi+Siswa'"
                >
                <h2>Mari Belajar Meraih Cita-cita!</h2>
                <p>Platform belajar interaktif untuk anak hebat Indonesia.</p>
            </div>

            <div class="login-form-container">
                <div class="login-logo">
                    <img
                        src="https://placehold.co/100x100/38BDF8/FFFFFF?text=Logo"
                        alt="Logo EduSky"
                    >
                    <h2>EduSky Learning</h2>
                </div>

                <h3 id="login-title">Selamat Datang! 👋</h3>
                <p class="text-muted login-subtitle">Silakan masuk menggunakan akun sekolahmu.</p>

                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label class="form-label">Pilih Jenjang</label>
                        <div class="level-selector" role="group" aria-label="Pilih jenjang sekolah">
                            <button type="button" class="level-btn active" data-level="sd" aria-pressed="true">Siswa SD</button>
                            <button type="button" class="level-btn" disabled title="Segera Hadir">SMP</button>
                            <button type="button" class="level-btn" disabled title="Segera Hadir">SMA</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="username">NIS atau Username</label>
                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Masukkan NIS atau username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrap">
                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Masukkan password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan password">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-label">
                            <input type="checkbox" id="remember-me" checked>
                            <span>Ingat saya</span>
                        </label>
                        <button type="button" id="forgot-password" class="text-link">Lupa password?</button>
                    </div>

                    <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>

                    <button type="submit" id="login-button" class="btn btn-primary login-button">
                        <span>Masuk Sekarang</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <p class="help-text">
                        Butuh bantuan?
                        <button type="button" id="contact-admin" class="text-link font-bold">Hubungi Admin/Guru</button>
                    </p>

                    <p class="account-switch">
                        <a href="pages/admin-login/index.html">Saya adalah admin</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/app-settings.js?v=20260722-2"></script>
    <script src="assets/js/support-center.js?v=20260719-6"></script>
    <script src="assets/js/login.js?v=20260719-2"></script>
</body>
</html>
